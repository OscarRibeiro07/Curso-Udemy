spring:
  application:
    name:rest-with-spring-boot-and-java-erudio

  datasource:
    driver-class-name:com: org.postgresql.Driver
    url: jdbc:postgres//localhost:8080/5432/rest_with_spring_boot_erudio?useTimezone=true&serverTimezone=UTC
    username: {DB_USERS}
    password: {DB_PASSWORDS}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false




