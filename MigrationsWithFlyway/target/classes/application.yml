spring:
  application:
    name: rest-with-spring-boot-and-java-erudio

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/rest_with_spring_boot_erudio?useTimezone=true&serverTimezone=UTC
    username: oscar
    password: oscar

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    # DEFINE CAMADA ONDE DEVE TESTAR/ EXECITAR O LOG
    #br.com.erudio:
    # ROOT DEFINE TODA A CAMADA E NÃO ESPECIFICO
    root: INFO
    org.flywaydb: INFO