server:
  port:
    context-path: 8888

spring:
  application:
    name: rest-with-spring-boot-and-java-erudio

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    org.flywaydb: INFO


  api-docs:
    path-to-match: /api/**/v1/**
    enabled: true
  swagger-ui:
    use-rrot-path: true
    path: /swagger-ui.html
    enabled: true